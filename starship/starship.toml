add_newline = true

format = """
$hostname\
$directory\
$git_branch\
$git_status\
$package\
$rust\
$golang\
$java\
$python\
$docker_context\
$aws\
$nix_shell\
$cmd_duration\
$line_break\
$character
"""

[hostname]
ssh_only = true
format = "[$hostname]($style) "
style = "bold blue"

[directory]
truncation_length = 4
truncate_to_repo = false
format = "[$path]($style) "
style = "bold cyan"

[git_branch]
format = "on [$symbol$branch]($style) "
symbol = " "
style = "bold purple"

[git_status]
format = "[$all_status$ahead_behind]($style) "
style = "bold red"

[package]
format = "is [$symbol$version]($style) "
symbol = "📦 "
style = "bold yellow"

[rust]
format = "via [$symbol($version )]($style)"
symbol = "🦀 "
style = "bold red"

[golang]
format = "via [$symbol($version )]($style)"
symbol = " "
style = "bold cyan"

[java]
format = "via [$symbol($version )]($style)"
symbol = "☕ "
style = "bold red"

[python]
format = "via [$symbol$version]($style) "
symbol = "🐍 "
style = "bold yellow"

[docker_context]
format = "via [$symbol$context]($style) "
symbol = "🐳 "
style = "blue bold"

[aws]
format = "on [$symbol($profile )(\\($region\\))]($style) "
symbol = "☁️  "
style = "bold yellow"

[nix_shell]
format = "via [$symbol$state]($style) "
symbol = "❄️  "
style = "bold blue"

[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "
style = "bold yellow"

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"
vimcmd_symbol = "[←](bold green)"
